---
- name: Make sure we have the bubble UPnP server folder
  ansible.builtin.file:
    path: "{{folders}}"
    state: directory
  become: true
  become_user: "{{ansible_user}}"
  vars:
    folders:
    - "{{home_folder}}/bubbleupnpserver"

- name: Install Bubble UPnP server image
  become: yes
  community.docker.docker_container:
    name: bubble
    image: bubblesoftapps/bubbleupnpserver-openj9:nogpu
    state: started
    restart_policy: unless-stopped
    network_mode: host
    command: -dataDir /data
#    networks:
#      - name: "bridge_to_the_internet"
    user: "0:0"
    env:
      TZ: "Europe/Paris"
    volumes:
    - "{{home_folder}}/bubbleupnpserver:/data"
    ports:
      - "1900/udp"
      - "58050/tcp"
      - "58051/tcp"
    labels: 
      guerite.update: "{{guerite_crontab}}"
      traefik.enable: "true"
      traefik.http.services.bubble.loadbalancer.server.port: "58050"
      traefik.http.routers.bubble.entrypoints: "websecure"
      traefik.http.routers.bubble.tls: "true"
      traefik.http.routers.bubble.tls.certresolver: "letsencrypt" 
      traefik.http.routers.bubble.rule: "Host(`nicolas-delsaux.hd.free.fr`) && PathPrefix(`/bubble`)"
#      traefik.http.routers.bubble.middlewares: "bubble@docker"
      traefik.http.middlewares.bubble-prefix.stripprefix.prefixes: "/bubble"
      traefik.http.middlewares.bubble-rewrite-body.plugin.rewritebody.rewrites[0].regex: "\"/"
      traefik.http.middlewares.bubble-rewrite-body.plugin.rewritebody.rewrites[0].replacement: "\"/bubble/"
      traefik.http.middlewares.bubble-rewrite-location.plugin.redirectLocation.default: "true"
#      traefik.http.middlewares.bubble.chain.middlewares: "bubble-rewrite-location, bubble-rewrite-body, bubble-prefix"
